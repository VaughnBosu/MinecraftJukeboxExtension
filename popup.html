<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Jukebox</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="top-bar">
        <div class="top-controls">
            <div class="settings-row" title="Adjust popup size">
                <label for="ui-scale-select" class="settings-label">Size</label>
                <select id="ui-scale-select" class="settings-select">
                    <option value="small">Small</option>
                    <option value="medium">Medium</option>
                    <option value="large">Large</option>
                </select>
            </div>
            <div class="volume-row" title="Adjust volume">
                <label for="volume-slider" class="volume-label">
                    <span class="volume-icon" aria-hidden="true"></span>
                    <span class="sr-only">Volume</span>
                </label>
                <input type="range" id="volume-slider" class="volume-slider" min="0" max="300" value="100" aria-label="Volume">
            </div>
        </div>
    </div>
    <div class="assets-status-row hidden" role="status" aria-live="polite">
        <span id="assets-status" class="assets-status"></span>
    </div>
    <input type="file" id="assets-directory-input" class="hidden-input" webkitdirectory multiple hidden>

<section class="jukebox-hero">
    <button type="button" class="disc hero-disc" data-disc-id="the_jukebox" aria-label="Play The Jukebox"></button>
    <p class="jukebox-hint">Click the Jukebox to Play Shuffled Minecraft Music.</p>
</section>

    <section class="disc-menu">
        <button id="disc-menu-toggle" class="disc-menu-toggle" type="button" aria-expanded="false" aria-controls="disc-menu-panel">
            <span class="toggle-label">Music Discs</span>
            <span class="toggle-icon" aria-hidden="true">▸</span>
        </button>
        <div id="disc-menu-panel" class="disc-menu-panel" hidden>
            <div class="disc-panel-actions">
                <button id="select-assets-btn" class="control-btn assets-btn" type="button" hidden>Use Local Minecraft Audio</button>
                <a class="control-btn info-btn" href="disc-help.html" target="_blank" rel="noreferrer noopener" aria-label="Learn how to load local Minecraft audio" hidden>Info</a>
                <p class="queue-tip">Left-click to start playing • Right/Shift-click to queue tracks</p>
            </div>
            <div id="discs"></div>
        </div>
    </section>

    <div class="disc-footer">
        <h4 id="now-playing" class="now-playing">Now Playing:</h4>
    </div>

    <div class="playback-bar">
        <div class="player-controls">
            <button id="skip-prev-btn" class="control-btn">⏮</button>
            <button id="rewind-btn" class="control-btn">-10s</button>
            <button id="play-pause-btn" class="control-btn">Play</button>
            <button id="forward-btn" class="control-btn">+10s</button>
            <button id="skip-next-btn" class="control-btn">⏭</button>
        </div>
        <div class="progress-wrapper">
            <span id="current-time" class="time-label">0:00</span>
            <input type="range" id="progress-bar" min="0" max="0" value="0" step="0.1" disabled>
            <span id="duration-time" class="time-label">0:00</span>
        </div>
    </div>

    <div class="queue-section">
        <div class="queue-heading-row">
            <h4 class="queue-heading">Queue</h4>
            <button id="clear-queue-btn" class="control-btn clear-queue-btn">Clear Queue</button>
        </div>
        <ul id="queue-list" class="queue-list"></ul>
    </div>

    <div class="footer-links">
        <a class="footer-btn sponsor-btn" href="mailto:vwbosu@gmail.com?subject=Minecraft%20Jukebox%20banner%20ad%20inquiry">Own a Minecraft server? Advertise here.</a>
        <div class="footer-link-row">
            <a class="footer-btn review-btn" href="https://chromewebstore.google.com/detail/minecraft-jukebox/mbibfcflbmlbcbnejgalgeijlpnjjgjc/reviews" target="_blank" rel="noopener">Leave a Review</a>
            <a class="footer-btn newsletter-btn" href="https://jukeboxmc.app/" target="_blank" rel="noopener">Sign up for our newsletter</a>
        </div>
    </div>


    <script src="shared.js"></script>
    <script src="popup/catalog.js"></script>
    <script src="popup/assets.js"></script>
    <script src="popup/player.js"></script>
    <script src="popup/main.js"></script>
</body>
</html>
